name: Release MoonTVPlus-TW to GHCR

on:
  push:
    branches: [moontvplus-tw]
    tags:
      - 'tw-v*'
      - 'v*-tw.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Retry an existing release version (must match package.json)'
        required: true
        type: string

concurrency:
  group: ghcr-tw-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/diannaotou/moontvplus-tw

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch and version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin moontvplus-tw
          git merge-base --is-ancestor "$GITHUB_SHA" origin/moontvplus-tw

          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_version="$(node -p "require('./package.json').version")"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_SHA" != "$(git rev-parse origin/moontvplus-tw)" ]]; then
              echo "Manual releases must run from the current moontvplus-tw head" >&2
              exit 1
            fi
            release_version="${{ inputs.version }}"
          else
            release_version="${GITHUB_REF_NAME#tw-v}"
            release_version="${release_version#v}"
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$release_version" != "$package_version" ]]; then
            echo "Release version $release_version does not match package.json version $package_version" >&2
            exit 1
          fi

          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify before publishing
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint:tw
          pnpm test --runInBand

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare platform name
        shell: bash
        run: echo "PLATFORM_NAME=${{ matrix.platform }}" | sed 's|/|-|g' >> "$GITHUB_ENV"

      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=MoonTVPlus-TW
            org.opencontainers.image.description=MoonTVPlus Taiwan Traditional Chinese localization
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=moontvplus-tw-${{ env.PLATFORM_NAME }}
          cache-to: type=gha,mode=max,scope=moontvplus-tw-${{ env.PLATFORM_NAME }}
          provenance: mode=max
          sbom: true

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_NAME }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve version tags
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          preserve_tag() {
            tag_name="$1"
            target="$2"
            if git rev-parse "refs/tags/$tag_name" >/dev/null 2>&1; then
              [[ "$(git rev-parse "$tag_name^{commit}")" == "$target" ]] || { echo "Tag target mismatch: $tag_name" >&2; exit 1; }
            else
              git tag -a "$tag_name" "$target" -m "MoonTVPlus-TW $tag_name"
              git push origin "refs/tags/$tag_name"
            fi
          }
          preserve_tag v1.0.1-phase1 e84f8d430f943c75e243e2f52929adc4d60e5ed0
          preserve_tag "v$RELEASE_VERSION" "$GITHUB_SHA"

      - name: Create and push multi-platform manifest
        working-directory: /tmp/digests
        shell: bash
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${{ needs.validate.outputs.version }}" \
            -t "${IMAGE_NAME}:v${{ needs.validate.outputs.version }}" \
            -t "${IMAGE_NAME}:latest" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect published image
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ needs.validate.outputs.version }}"
